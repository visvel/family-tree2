<!-- tree.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { margin: 0; }
    .node rect { fill: #fff; stroke: #333; stroke-width: 1.5px; }
    .node text { font: 12px sans-serif; pointer-events: none; }
    .link { fill: none; stroke: #ccc; stroke-width: 1.5px; }
    .expand-icon {
      font-size: 18px;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="tree"></div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    const treeData = JSON.parse(localStorage.getItem('treeData'));

    const width = 1200, height = 800;
    const svg = d3.select("#tree")
      .append("svg")
      .attr("width", width)
      .attr("height", height)
      .append("g")
      .attr("transform", "translate(50,50)");

    const treeLayout = d3.tree().size([width - 100, height - 100]);
    const root = d3.hierarchy(treeData, d => d.children);
    treeLayout(root);

    svg.selectAll('path.link')
      .data(root.links())
      .enter()
      .append('path')
      .attr('class', 'link')
      .attr('d', d3.linkVertical()
        .x(d => d.x)
        .y(d => d.y));

    const node = svg.selectAll('g.node')
      .data(root.descendants())
      .enter()
      .append('g')
      .attr('class', 'node')
      .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

    node.append('rect')
      .attr('width', 140)
      .attr('height', 60)
      .attr('x', -70)
      .attr('y', -30)
      .style('fill', '#f9f9f9')
      .style('stroke', '#333');

    node.append('text')
      .attr('text-anchor', 'middle')
      .attr('dy', '-0.5em')
      .style('fill', 'blue')
      .style('cursor', 'pointer')
      .text(d => d.data.name)
      .on('click', d => window.open(d.data.url, '_blank'));

    node.append('text')
      .attr('text-anchor', 'middle')
      .attr('dy', '1.2em')
      .text(d => (d.data.dob || '') + ' ' + (d.data.valavu || ''));

    node.append('text')
      .attr('class', 'expand-icon')
      .attr('x', 60)
      .attr('y', -20)
      .text('+')
      .on('click', (event, d) => {
        alert(`Expand details for ${d.data.name}`);
      });
  </script>
</body>
</html>
