<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Family Tree</title>
  <style>
    .node rect { stroke: #333; stroke-width: 1.5px; }
    .node text { font: 12px sans-serif; pointer-events: none; }
    .link { fill: none; stroke: #ccc; stroke-width: 1.5px; }
  </style>
</head>
<body>
  <div id="tree"></div>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    const treeData = JSON.parse(localStorage.getItem("treeData"));
    console.log("📦 treeData loaded from localStorage:", treeData);

    if (!treeData || !treeData.name) {
      console.error("❌ treeData is missing or invalid.");
    }

    const width = 1200, height = 700;
    const svg = d3.select("#tree")
      .append("svg")
      .attr("width", width)
      .attr("height", height)
      .append("g")
      .attr("transform", "translate(50,50)");

    const treeLayout = d3.tree().size([width - 100, height - 100]);
    const root = d3.hierarchy(treeData, d => d.children);

    console.log("🌳 Hierarchy built. Number of descendants:", root.descendants().length);

    treeLayout(root);

    const links = root.links();
    console.log("🔗 Total links to draw:", links.length);

    svg.selectAll('path.link')
      .data(links)
      .enter()
      .append('path')
      .attr('class', 'link')
      .attr('d', d3.linkVertical()
        .x(d => d.x)
        .y(d => d.y));

    const node = svg.selectAll('g.node')
      .data(root.descendants())
      .enter()
      .append('g')
      .attr('class', 'node')
      .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

    node.each(function(d) {
      const g = d3.select(this);
      if (d.data.type === 'couple') {
        console.log("👫 Rendering couple node:", d.data.husband.name, "&", d.data.wife.name);
        g.append('rect')
          .attr('x', -70).attr('y', -40).attr('width', 140).attr('height', 30)
          .style('fill', '#d0e1f9');
        g.append('text')
          .attr('x', 0).attr('y', -20)
          .attr('text-anchor', 'middle')
          .text(d.data.husband.name);
        g.append('rect')
          .attr('x', -70).attr('y', -10).attr('width', 140).attr('height', 30)
          .style('fill', '#f9d0f0');
        g.append('text')
          .attr('x', 0).attr('y', 10)
          .attr('text-anchor', 'middle')
          .text(d.data.wife.name);
      } else {
        console.log("👤 Rendering individual node:", d.data.name);
        g.append('rect')
          .attr('x', -70).attr('y', -30).attr('width', 140).attr('height', 60)
          .style('fill', d.data.gender === 'F' ? '#f9d0f0' : '#d0e1f9');
        g.append('text')
          .attr('x', 0).attr('y', -5)
          .attr('text-anchor', 'middle')
          .text(d.data.name);
        g.append('text')
          .attr('x', 0).attr('y', 15)
          .attr('text-anchor', 'middle')
          .text((d.data.dob || '') + ' ' + (d.data.valavu || ''));
      }
    });

    console.log("✅ Rendering complete.");
  </script>
</body>
</html>
